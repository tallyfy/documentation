name: Documentation Pipeline

# Design (see tallyfy/documentation#56):
# Staging is the sole owner of auto-regen. The 3 jobs that rewrite MDX files
# (generate-snippets, update-last-modified, generate-related-articles) early-exit
# when head_branch == "main". After a staging → main merge, main inherits the
# frozen staging-side output and the main pipeline never re-touches it. This
# eliminates the perpetual <CardGrid> drift caused by main and staging querying
# different Answers indexes (answers.tallyfy.com vs staging.answers.tallyfy.com).
# Main still runs: validate-markdown, upload-to-tallyfy-answers (prod search),
# check-deleted-files (clean prod Answers), and sync (rsync to support-docs).

on:
  workflow_run:
    workflows: ["Tallyfy Answers - Generate IDs"]
    types:
      - completed

# One run per branch at a time (tallyfy/documentation#296). On 2026-09-23 #290 and #292 merged
# into staging eight seconds apart, and run 35813745697's update-last-modified failed with
# "fatal: Need to specify how to reconcile divergent branches" because run 35813737212 had
# already pushed. Two runs that both reach `sync` can finish out of order and publish the older
# tree last. Keyed on head_branch, because on workflow_run `github.ref` is the DEFAULT branch
# whatever branch was pushed, so it would put main and staging in one queue.
#
# cancel-in-progress is false so a running `sync` is never cut off part way. GitHub keeps only
# one WAITING run per group, so a third push while one run works and one waits drops the
# waiting one. Every job reads the whole tree, so the run that takes its place covers it: since
# owner decision 218 (2026-10-03, #296) that includes generate-snippets and check-deleted-files,
# which until then acted on the triggering commit alone and lost a dropped run's work.
# Asserted by `scripts/pipeline-guard.py --check-wiring`, which pr-validate.yml runs.
concurrency:
  group: documentation-pipeline-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  # The push gate (tallyfy/documentation#464). A GitHub App with contents: write, such as
  # launchbrightly[bot], can push to staging or main without a pull request, and a ruleset cannot
  # exempt the pipeline's own pushes. So every job that holds a secret, an environment or a write
  # token waits for this one, and it stops them when a bot other than github-actions[bot] and
  # tallyfy-workhorse[bot] put commits on the branch outside a merged pull request. It then opens
  # one issue listing them; a person accepts them by closing that issue as completed.
  #
  # No `needs`, no `if:` and no checkout: it always runs, and it runs no code from the repository,
  # only the script below, which an app without the workflows permission cannot change. The same
  # script is in generate-ids.yml; only the env differs. `scripts/pipeline-guard.py --check-wiring`
  # asserts all of this, and that every job holding a secret, an environment or a push waits for it.
  push-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: read
      issues: write
    steps:
      - name: Stop when commits reached the branch without a pull request
        uses: actions/github-script@v9
        env:
          GATE_MODE: pipeline
          GATE_BRANCH: ${{ github.event.workflow_run.head_branch }}
          GATE_RUN_ID: ${{ github.run_id }}
          GATE_TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
          GATE_TRIGGER_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          GATE_TRIGGER_HEAD: ${{ github.event.workflow_run.head_sha }}
        with:
          script: |
            // The push gate (tallyfy/documentation#464). A GitHub App with contents: write can push to staging
            // or main without a pull request, and a ruleset cannot exempt the pipeline's own pushes, so this
            // job stops every job after it instead. launchbrightly[bot] (id 270903805) is the app it was
            // written for, but the rule covers every app bot except the two allowed below.
            //
            // It runs no code from the repository: the logic is here, in a workflow file, which an app
            // without the workflows permission cannot change, and it reads only the GitHub API. The copy in
            // generate-ids.yml and the copy in documentation-pipeline.yml must stay identical; only their env
            // differs. `scripts/pipeline-guard.py --check-wiring` asserts both.
            //
            // Range: from the head of the last run of generate-ids.yml on this branch that concluded success
            // (or of the run that started this one, when it succeeded) through this run's head. In the
            // documentation pipeline the head is the branch tip, because every later job checks out the tip.
            // At most 250 commits. Runs of documentation-pipeline.yml cannot be the anchor: on workflow_run
            // the API reports every one of them as staging, at staging's head (measured 2026-11-06).
            //
            // A commit stops the run when a bot other than the two allowed authored or committed it and no
            // merged pull request has it as its merge commit. A push or merge to the branch since the anchor
            // stops it when a bot other than the two allowed made it, whatever the commit says about its
            // author, because the repository activity API records who pushed. A person accepts stopped commits
            // by closing this job's issue as completed. Anything it cannot read fails the job.
            const ALLOWED_BOTS = ['github-actions[bot]', 'tallyfy-workhorse[bot]'];
            const MAX_COMMITS = 250;
            const MAX_ACTIVITY_PAGES = 5;
            const SHA_RE = /^[0-9a-f]{40}$/;
            const gateEnv = process.env;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = gateEnv.GATE_BRANCH || '';
            const dryRun = gateEnv.GATE_DRY_RUN === '1';
            const title = `Docs pipeline stopped: commits reached ${branch} without a pull request`;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            class CannotDecide extends Error {}
            const short = (sha) => String(sha || '').slice(0, 12);
            const isBotLogin = (login) => /\[bot\]$/i.test(String(login || ''));
            const disallowed = (login) => Boolean(login) && !ALLOWED_BOTS.includes(String(login).toLowerCase());

            // The app bot a commit names: its GitHub account when that is a bot, else a [bot] name in its git
            // identity, so a bot's commit with an email GitHub does not link to an account is still seen.
            function botIn(user, name, email) {
              if (user && (user.type === 'Bot' || isBotLogin(user.login))) return String(user.login).toLowerCase();
              const m = `${name || ''} ${email || ''}`.match(/([A-Za-z0-9][A-Za-z0-9-]*\[bot\])/i);
              return m ? m[1].toLowerCase() : null;
            }

            async function api(route, params) {
              try {
                // A full URL (the activity API's next page) already carries its query; add nothing to it.
                return route.includes('https://') ? await github.request(route)
                  : await github.request(route, { owner, repo, ...(params || {}) });
              } catch (err) {
                throw new CannotDecide(`${route} failed: ${err.status || ''} ${err.message || err}`.trim());
              }
            }

            async function findAnchor() {
              if (dryRun && SHA_RE.test(gateEnv.GATE_ANCHOR_OVERRIDE || '')) {
                return { sha: gateEnv.GATE_ANCHOR_OVERRIDE, from: 'GATE_ANCHOR_OVERRIDE (dry run only)' };
              }
              if (gateEnv.GATE_TRIGGER_CONCLUSION === 'success' && SHA_RE.test(gateEnv.GATE_TRIGGER_HEAD || '')) {
                return { sha: gateEnv.GATE_TRIGGER_HEAD, from: `the generate-ids run that started this one (${gateEnv.GATE_TRIGGER_RUN_ID})` };
              }
              const skip = new Set([String(gateEnv.GATE_RUN_ID || ''), String(gateEnv.GATE_TRIGGER_RUN_ID || '')]);
              const { data } = await api('GET /repos/{owner}/{repo}/actions/workflows/{workflow_id}/runs',
                { workflow_id: 'generate-ids.yml', branch, status: 'success', per_page: 20 });
              const runs = ((data && data.workflow_runs) || []).filter((r) => r.head_branch === branch
                && r.conclusion === 'success' && !skip.has(String(r.id)) && SHA_RE.test(r.head_sha || ''));
              if (!runs.length) {
                throw new CannotDecide(`no earlier successful run of generate-ids.yml on ${branch}, so there is no checked point to start from`);
              }
              return { sha: runs[0].head_sha, from: `generate-ids run ${runs[0].id}` };
            }

            async function findHead() {
              if (gateEnv.GATE_MODE === 'push') {
                if (!SHA_RE.test(gateEnv.GATE_HEAD || '')) throw new CannotDecide(`GATE_HEAD ${JSON.stringify(gateEnv.GATE_HEAD)} is not a commit`);
                return gateEnv.GATE_HEAD;
              }
              const { data } = await api('GET /repos/{owner}/{repo}/branches/{branch}', { branch });
              const sha = data && data.commit && data.commit.sha;
              if (!SHA_RE.test(sha || '')) throw new CannotDecide(`could not read the tip of ${branch}`);
              return sha;
            }

            async function rangeCommits(base, head) {
              if (base === head) return { status: 'identical', commits: [] };
              const seen = new Map();
              let status = '';
              let total = -1;
              for (let page = 1; page <= Math.ceil(MAX_COMMITS / 100); page += 1) {
                const { data } = await api('GET /repos/{owner}/{repo}/compare/{basehead}',
                  { basehead: `${base}...${head}`, per_page: 100, page });
                status = data && data.status;
                total = data ? data.total_commits : -1;
                if (status === 'identical' || status === 'behind') return { status, commits: [] };
                if (status !== 'ahead') {
                  throw new CannotDecide(`${short(base)}...${short(head)} is ${JSON.stringify(status)}, so the branch history was rewritten since the last checked run`);
                }
                if (!(total >= 0)) throw new CannotDecide('the compare response has no total_commits');
                if (total > MAX_COMMITS) throw new CannotDecide(`${total} commits since the last checked run, over the cap of ${MAX_COMMITS}`);
                const batch = (data && data.commits) || [];
                for (const c of batch) seen.set(c.sha, c);
                if (seen.size >= total || !batch.length) break;
              }
              if (seen.size !== total) throw new CannotDecide(`read ${seen.size} of ${total} commits in ${short(base)}...${short(head)}`);
              return { status, commits: [...seen.values()] };
            }

            function identity(c) {
              const a = (c.commit && c.commit.author) || {};
              const k = (c.commit && c.commit.committer) || {};
              const acct = (u) => (u && u.login ? ` (${u.login})` : '');
              return `author ${a.name || '?'} <${a.email || '?'}>${acct(c.author)}, committer ${k.name || '?'} <${k.email || '?'}>${acct(c.committer)}`;
            }

            async function pushesSince(anchorSha) {
              // Newest first. Every push or merge down to and including the one that produced the anchor.
              const out = [];
              let next = null;
              for (let page = 1; page <= MAX_ACTIVITY_PAGES; page += 1) {
                const res = next ? await api(`GET ${next}`)
                  : await api('GET /repos/{owner}/{repo}/activity', { ref: `refs/heads/${branch}`, per_page: 100 });
                for (const a of (res.data || [])) {
                  out.push(a);
                  if (a.after === anchorSha) return out;
                }
                const link = String((res.headers && res.headers.link) || '');
                const m = link.match(/<([^>]+)>;\s*rel="next"/);
                if (!m) return out;  // the whole history the API keeps, all of it after the anchor
                next = m[1];
              }
              throw new CannotDecide(`more than ${MAX_ACTIVITY_PAGES * 100} pushes since ${short(anchorSha)}, more than this gate reads`);
            }

            async function acceptedShas() {
              // A person closing this job's issue as completed accepts every commit the issue lists.
              const out = new Map();
              const { data } = await api('GET /repos/{owner}/{repo}/issues',
                { state: 'closed', creator: 'github-actions[bot]', per_page: 100 });
              for (const issue of (data || [])) {
                if (issue.pull_request || issue.title !== title) continue;
                const { data: full } = await api('GET /repos/{owner}/{repo}/issues/{issue_number}', { issue_number: issue.number });
                const by = full && full.closed_by;
                if (!full || full.state_reason !== 'completed' || !by || by.type === 'Bot' || isBotLogin(by.login)) continue;
                for (const m of String(full.body || '').matchAll(/\b[0-9a-f]{40}\b/g)) {
                  if (!out.has(m[0])) out.set(m[0], issue.number);
                }
              }
              return out;
            }

            async function report(lines, anchor, head, range) {
              const body = [
                `The push gate stopped the documentation pipeline on \`${branch}\`. These commits reached the branch without a pull request, made or claimed by a GitHub App other than github-actions[bot] and tallyfy-workhorse[bot]:`,
                '',
                ...lines,
                '',
                `Range checked: \`${short(anchor.sha)}...${short(head)}\`, ${range.commits.length} commit(s). Run: ${runUrl}`,
                '',
                'Every job that holds a secret, an environment or a write token waits for this gate, so nothing after it ran.',
                '',
                'To accept these commits, review each one, then close this issue as completed and re-run the failed workflow. Closing it as not planned keeps the pipeline stopped. A close by a bot is ignored.',
              ].join('\n');
              if (dryRun) {
                core.info(`DRY RUN: would open or update the issue "${title}" with:\n${body}`);
                return;
              }
              const { data: open } = await api('GET /repos/{owner}/{repo}/issues',
                { state: 'open', creator: 'github-actions[bot]', per_page: 100 });
              const existing = (open || []).filter((i) => !i.pull_request && i.title === title);
              if (existing.length) {
                const issue = existing[0];
                const missing = lines.filter((l) => !String(issue.body || '').includes(l.slice(3, 43)));
                if (missing.length) {
                  await api('PATCH /repos/{owner}/{repo}/issues/{issue_number}',
                    { issue_number: issue.number, body: `${issue.body || ''}\n\nAlso stopped by ${runUrl}:\n\n${missing.join('\n')}` });
                }
                core.error(`See #${issue.number}.`);
              } else {
                const { data: created } = await api('POST /repos/{owner}/{repo}/issues', { title, body });
                core.error(`Opened #${created.number}.`);
              }
            }

            async function gate() {
              if (!['push', 'pipeline'].includes(gateEnv.GATE_MODE)) throw new CannotDecide(`GATE_MODE is ${JSON.stringify(gateEnv.GATE_MODE)}`);
              if (!/^[A-Za-z0-9._/-]+$/.test(branch)) throw new CannotDecide(`branch ${JSON.stringify(branch)} is not a branch name`);
              const anchor = await findAnchor();
              const head = await findHead();
              const range = await rangeCommits(anchor.sha, head);
              const found = new Map();
              const add = (sha, why) => { if (!found.has(sha)) found.set(sha, []); found.get(sha).push(why); };

              for (const c of range.commits) {
                const bots = [...new Set([
                  botIn(c.author, c.commit && c.commit.author && c.commit.author.name, c.commit && c.commit.author && c.commit.author.email),
                  botIn(c.committer, c.commit && c.commit.committer && c.commit.committer.name, c.commit && c.commit.committer && c.commit.committer.email),
                ].filter(disallowed))];
                if (!bots.length) continue;
                const { data: prs } = await api('GET /repos/{owner}/{repo}/commits/{commit_sha}/pulls', { commit_sha: c.sha, per_page: 100 });
                const merged = (prs || []).find((p) => p.merged_at && p.merge_commit_sha === c.sha);
                if (merged) {
                  core.info(`${short(c.sha)} by ${bots.join(' and ')} is the merge commit of pull request #${merged.number}.`);
                  continue;
                }
                add(c.sha, `${identity(c)}; no merged pull request has it as its merge commit`);
              }

              const pushes = await pushesSince(anchor.sha);
              for (const a of pushes) {
                const who = a.actor && a.actor.login;
                if (a.actor && (a.actor.type === 'Bot' || isBotLogin(who)) && disallowed(who) && SHA_RE.test(a.after || '')) {
                  add(a.after, `${a.activity_type} to ${branch} by ${who} at ${a.timestamp}`);
                }
              }

              const accepted = found.size ? await acceptedShas() : new Map();
              const open = [...found].filter(([sha]) => !accepted.has(sha));
              for (const [sha] of found) {
                if (accepted.has(sha)) core.info(`${short(sha)} was accepted by a person in #${accepted.get(sha)}.`);
              }
              core.info(`Checked ${short(anchor.sha)}...${short(head)} on ${branch} (${range.status}): ${range.commits.length} commit(s) and ${pushes.length} push(es), starting from ${anchor.from}.`);
              if (!open.length) {
                core.info('No commit reached the branch without a pull request.');
                return;
              }
              const lines = open.map(([sha, why]) => `- \`${sha}\`: ${why.join('; ')}`);
              for (const line of lines) core.error(line);
              await report(lines, anchor, head, range);
              core.setFailed(`${open.length} commit(s) reached ${branch} without a pull request. Every job after this gate is stopped.`);
            }

            try {
              await gate();
            } catch (err) {
              if (err instanceof CannotDecide) core.setFailed(`The push gate could not decide, so nothing after it runs: ${err.message}`);
              else core.setFailed(`The push gate crashed, so nothing after it runs: ${(err && err.stack) || err}`);
            }

  # Blocks a staging -> main promotion that carries a path on hold (see #118, successor to
  # #88). A root job on purpose: nothing upstream can skip it. It is listed in the `needs` of
  # every job that can publish, because a red gate that does not stop the publish is
  # decoration - that wiring is itself asserted by the --check-wiring step below.
  #
  # NOTE on SHAs: on a workflow_run event `github.sha` is the head of the DEFAULT branch
  # (staging), not the commit that triggered the run. Measured on two real promotions:
  # run 30914229312 reported sha=92156c924 for a push of 0c8011844 to main, and run
  # 30619407542 reported c25ac48ea for a push of 44fbbdbe5. So the promoted commit is
  # workflow_run.head_sha, and the job re-verifies it is on origin/main before trusting it.
  promotion-hold-gate:
    # Deliberately NO `if:` and NO `needs:`, so this job can never be skipped.
    # Measured on run 27840821129: when the triggering run does not succeed, every
    # `if: conclusion == 'success'` job skips, and `sync` STILL RUNS - its
    # `if: !failure() && !cancelled()` is a status-function conditional, which overrides the
    # default "skip when a needed job was skipped". A gate carrying that same `if:` would
    # therefore be skipped on exactly the runs where `sync` publishes unchecked. A gate that
    # can be skipped is not a gate, so this one always runs.
    # Read only (#464): it runs scripts from the pushed tree without waiting for push-gate, so a
    # direct push must not be able to use its token to push or to edit the gate's issues.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0   # merge-base --is-ancestor needs real history
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Prove the gate can fail (red and green control)
        run: python scripts/promotion-hold-check.py --self-test
        shell: bash
      - name: Prove the gate is still wired to the publishing jobs
        run: |
          python -m pip install --upgrade pyyaml
          python scripts/promotion-hold-check.py --check-wiring
        shell: bash
      # The hold list comes from the AUTHORING branch, never from the promoted tree.
      #
      # Measured 2026-09-20 on run 35532856946, a real promote of 0a6b25249 to main: this job
      # checked out the promoted tree, read ITS copy of the list, and logged "0 active
      # hold(s). ... No active holds. Nothing can be violated." The vault-screen hold was live
      # on staging the whole time. A hold is written on the branch the content is authored on,
      # so a promote that never carried the hold file forward judges itself against an empty
      # list. See tallyfy/documentation#270.
      #
      # test -s separates "the fetch produced nothing" from "the list has no holds": an empty
      # file parses as zero holds and passes everything, which is the answer a broken fetch
      # also gives. The real list always carries its header comment, so it is never empty.
      - name: Fetch the hold list from the authoring branch
        env:
          AUTHORING_BRANCH: staging
        run: |
          git fetch --no-tags origin "$AUTHORING_BRANCH"
          git show "FETCH_HEAD:.github/promotion-holds.txt" > "$RUNNER_TEMP/holds.txt"
          test -s "$RUNNER_TEMP/holds.txt"
          echo "Hold list taken from origin/$AUTHORING_BRANCH:"
          cat "$RUNNER_TEMP/holds.txt"
        shell: bash
      - name: Check the promotion against the hold list
        # Values go through env, never straight into the shell line: workflow_run is a
        # privileged trigger and its payload is attacker-influenced input.
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          python scripts/promotion-hold-check.py --commit "$HEAD_SHA" --branch "$HEAD_BRANCH" \
            --holds "$RUNNER_TEMP/holds.txt"
        shell: bash

  # Blocks content carrying AI rhetorical tells - a sentence that promises significance and
  # defers the fact ("Here's the catch", "the hard part", "what nobody knew"). See
  # tallyfy/documentation#191. The 26 word blacklist in CLAUDE.md could not catch any of those,
  # because none of them contains a banned word: the objection is to a MOVE, not a vocabulary
  # item.
  #
  # A root job for the same reason promotion-hold-gate is one, and it is the same measurement:
  # on run 27840821129 every `if:`-guarded job skipped and `sync` STILL RAN, because its
  # `if: !failure() && !cancelled()` is a status-function conditional that replaces the default
  # "skip when a needed job was skipped". A gate carrying that same `if:` would be skipped on
  # exactly the runs where `sync` publishes unchecked. So: no `needs:`, no `if:`.
  ai-tell-gate:
    # Deliberately NO `if:` and NO `needs:`. --check-wiring asserts both, so a later edit that
    # adds either one fails the gate rather than quietly disarming it.
    # Read only (#464): it runs scripts from the pushed tree without waiting for push-gate, so a
    # direct push must not be able to use its token to push or to edit the gate's issues.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Prove the gate can fail (red and green control, per rule)
        run: python scripts/ai-tell-check.py --self-test
        shell: bash
      - name: Prove the gate is still wired to the publishing job
        run: |
          python -m pip install --upgrade pyyaml
          python scripts/ai-tell-check.py --check-wiring
        shell: bash
      - name: Check every article for AI rhetorical tells
        run: python scripts/ai-tell-check.py --dir src/content/docs
        shell: bash

  validate-markdown:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    # Read only (#464): it runs scripts from the pushed tree without waiting for push-gate, so a
    # direct push must not be able to use its token to push or to edit the gate's issues.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 2
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Markdown Lint Script
        run: |
          python -m pip install --upgrade pyyaml
          python scripts/markdown-lint.py --dir="$PWD"
        shell: bash
      - name: Accessibility lint (headings 1.3.1, alt text 1.1.1, D2 animation 2.2.2)
        run: python scripts/a11y-lint.py --dir="$PWD"
        shell: bash

  # Screenshots committed under screenshots/launchbrightly/ and linked from articles by repository
  # path (tallyfy/documentation#464). On staging it uploads each new or changed image to
  # screenshots.tallyfy.com under a content-hashed key, reads it back, records it in
  # documentation_assets.csv and commits only that file. It never deletes from R2. On main it
  # only checks that every linked image has a row matching its bytes and its public copy; the
  # support-docs build swaps each repository path for the row's URL.
  #
  # The upload credentials live in the r2-screenshots environment and reach one step, the
  # staging ingest, through that step's env. No workflow a pull request starts names a secret or
  # an environment. Both are asserted by `scripts/pipeline-guard.py --check-wiring`, which
  # pr-validate.yml runs.
  #
  # generate-snippets and sync wait for this job, so the inventory commit lands before any other
  # generator pushes and before sync copies the CSV to support-docs. With no screenshots/ folder
  # it uploads nothing, needs no credential and commits nothing.
  repo-screenshots:
    needs: [validate-markdown, push-gate]
    runs-on: ubuntu-latest
    environment: r2-screenshots
    permissions:
      contents: write
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0   # the ingest reads the CSV's whole history for LaunchBrightly commits
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      # A workflow_run workflow runs the DEFAULT branch's copy of this file, so on a run for main
      # this job exists before main carries the script. Then the verify step below decides.
      - name: Prove the ingest can refuse (red and green, fake R2)
        env:
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          if [ "$HEAD_BRANCH" = "main" ] && [ ! -f scripts/asset_management/repo_screenshots.py ]; then
            echo "main does not carry repo_screenshots.py yet; the verify step decides whether that matters."
            exit 0
          fi
          python -m pip install --upgrade requests python-dotenv
          python scripts/asset_management/repo_screenshot_rules.py --self-test
          python scripts/asset_management/repo_screenshots.py --self-test
        shell: bash
      - name: Verify repository screenshots (main)
        if: ${{ github.event.workflow_run.head_branch == 'main' }}
        env:
          REF_PATTERN: "[(<\"']/screenshots/"
        run: |
          if [ ! -f scripts/asset_management/repo_screenshots.py ]; then
            rc=0
            grep -rqE -- "$REF_PATTERN" src/content/docs || rc=$?
            case "$rc" in
              0) echo "::error::an article links a /screenshots/ path, and main has no repo_screenshots.py to verify it"
                 exit 1 ;;
              1) echo "No article links a /screenshots/ path, so there is nothing to verify."
                 exit 0 ;;
              *) echo "::error::could not search the articles (grep exit $rc)"
                 exit 1 ;;
            esac
          fi
          python scripts/asset_management/repo_screenshots.py verify --online
        shell: bash
      # Installed in its own step, so nothing pip runs ever sees the credentials below.
      - name: Install the S3 client (staging)
        if: ${{ github.event.workflow_run.head_branch == 'staging' }}
        run: python -m pip install --upgrade boto3
        shell: bash
      - name: Upload and record repository screenshots (staging)
        if: ${{ github.event.workflow_run.head_branch == 'staging' }}
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          git pull --ff-only
          python scripts/asset_management/repo_screenshots.py ingest
        shell: bash
      - name: Commit the inventory (staging)
        if: ${{ github.event.workflow_run.head_branch == 'staging' }}
        run: |
          if [[ -z $(git status --porcelain -- documentation_assets.csv) ]]; then
            echo "No inventory change. Nothing to commit."
            exit 0
          fi
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -- documentation_assets.csv
          git commit -m "Inventory repository screenshots" -- documentation_assets.csv
          git pull --no-rebase
          git push
        shell: bash

  generate-snippets:
    needs: [validate-markdown, repo-screenshots]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          ref: ${{ github.event.workflow_run.head_branch }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      # generate-snippets.py imports frontmatter and requests at module level, so the
      # self-test needs them even though it touches no file and no API.
      - name: Prove the description post-processor can fail (red and green control)
        run: |
          python -m pip install --upgrade python-frontmatter requests
          python scripts/generate-snippets.py --self-test
        shell: bash
      # The whole tree, not the pages this push added (owner decision 218, #296). A page with
      # no description, or a blank one, gets one; an existing description is never overwritten;
      # at most 10 pages per run, because each is one Claude API call.
      - name: Generate snippets script
        run: |
          if [ "${{ github.event.workflow_run.head_branch }}" = "main" ]; then
            echo "Skipping snippet generation on main — staging owns auto-regen (see #56). Files inherit from staging via merge."
            exit 0
          fi
          git pull
          python -m pip install --upgrade python-frontmatter requests
          python scripts/generate-snippets.py --dir="$PWD" --token ${{ secrets.CLAUDE_API_KEY }} --prompt ${{ secrets.CLAUDE_PROMPT }}
        shell: bash
      - name: Commit and push articles with snippets
        if: ${{ github.event.workflow_run.head_branch != 'main' }}
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            git config --local user.email "action@github.com"
            git config --local user.name "GitHub Action"
            git pull --no-rebase
            git add .
            if [[ -n $(git status --porcelain) ]]; then
              git commit -m "Push Articles With snippet(s)" -a
              git push
            else
              echo "No changes to commit after git pull"
            fi
          else
            echo "No page lacks a description. Nothing to commit."
          fi

  upload-to-tallyfy-answers:
    # promotion-hold-gate: on main this uploads to the PRODUCTION Answers index, so held
    # content must not reach it either.
    needs: [generate-snippets, promotion-hold-gate]
#    needs: validate-markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          ref: ${{ github.event.workflow_run.head_branch }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Dump articles into JSON file
        run: |
          git pull
          python -m pip install --upgrade python-frontmatter requests
          # main feeds production search only, staging feeds staging search only (owner decision
          # 2026-10-27, tallyfy/documentation#415). Before this, main also overwrote staging search.
          if [ "${{ github.event.workflow_run.head_branch }}" = "main" ]; then
            python scripts/answers-connector.py --dir="$PWD/src/content/docs" --collection_name=tyfy --answers_api_key=${{ secrets.ANSWERS_API_KEY }} --base_urls https://answers.tallyfy.com
          else
            python scripts/answers-connector.py --dir="$PWD/src/content/docs" --collection_name=tyfy --answers_api_key=${{ secrets.ANSWERS_API_KEY }} --base_urls https://staging.answers.tallyfy.com
          fi
        shell: bash

  check-deleted-files:
    # Runs on BOTH branches, each against its own Answers index: staging -> staging Answers,
    # main -> prod Answers, exactly like upload-to-tallyfy-answers.
    #
    # Whole tree, every run (owner decision 218, 2026-10-03, #296). It lists the index and
    # deletes the entries whose uid no page in the tree carries, so a page deleted in a push
    # whose run was dropped, or whose id changed, still leaves search. It used to read one
    # commit's deletions (diff-filter=D) and lost exactly those. Measured read only that day:
    # 3 such entries in the staging index, 1 in production. At most 25 deletes per run; more
    # orphans than a fifth of the index deletes nothing and fails, because a wrong tree would
    # make every entry look orphaned. Each delete is read back.
    needs: upload-to-tallyfy-answers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The branch TIP, the tree upload-to-tallyfy-answers just indexed (it checks out
          # head_branch and pulls). Judging the index against an older tree would delete the
          # entries of pages added since, and the next upload would put them straight back.
          ref: ${{ github.event.workflow_run.head_branch }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      # The script comes from the authoring branch, like the publish guard in `sync`. A
      # workflow_run workflow runs the DEFAULT branch's copy of this file, so on a run for main
      # this step exists before main carries the new script; main's own copy takes
      # --commit_sha and would fail every production run until the next promotion.
      - name: Fetch the prune script from the authoring branch and prove it can refuse
        env:
          AUTHORING_BRANCH: staging
        run: |
          git fetch --no-tags origin "$AUTHORING_BRANCH"
          git show "FETCH_HEAD:scripts/check-deleted-files.py" > "$RUNNER_TEMP/check-deleted-files.py"
          test -s "$RUNNER_TEMP/check-deleted-files.py"
          python -m pip install --upgrade python-frontmatter requests
          python "$RUNNER_TEMP/check-deleted-files.py" --self-test
        shell: bash
      - name: Remove index entries whose page is gone
        # head_branch goes through env, never straight into the shell line: workflow_run is a
        # privileged trigger and head_branch is attacker-influenced input.
        #
        # The key does NOT go through env. It goes on the command line exactly as
        # upload-to-tallyfy-answers passes it, because the stored secret only works after the
        # shell has parsed it. Measured on run 37143848015 (2026-10-03): the upload, with the key
        # inline, got 200 from the staging index, and this step, with the same secret through
        # env, got 403 a minute later. A local key taken from the Answers service's own env
        # file got 200 through the same script, so the script is not the difference.
        env:
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          case "$HEAD_BRANCH" in
            main) base_url=https://answers.tallyfy.com ;;
            staging) base_url=https://staging.answers.tallyfy.com ;;
            *) echo "Branch $HEAD_BRANCH is neither main nor staging, so no index is judged against its tree."
               exit 0 ;;
          esac
          python "$RUNNER_TEMP/check-deleted-files.py" --dir="$PWD" --collection_name=tyfy \
            --answers_api_key=${{ secrets.ANSWERS_API_KEY }} --base_url="$base_url"
        shell: bash


  update-last-modified:
    needs: upload-to-tallyfy-answers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Full history for accurate Git dates
          ref: ${{ github.event.workflow_run.head_branch }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Update lastUpdated dates from Git history
        run: |
          if [ "${{ github.event.workflow_run.head_branch }}" = "main" ]; then
            # A promotion pull request into main carries its pages' dates itself (#492), checked by
            # the promotion-dates job in pr-validate.yml, so this job still never writes to main.
            echo "Skipping lastUpdated regen on main: staging owns auto-regen (#56), and a promotion carries its pages' dates in its own pull request (#492)."
            exit 0
          fi
          git pull
          python -m pip install --upgrade python-frontmatter
          # Prove the parser reads git's UTC `Z` dates on this job's Python 3.10 before
          # trusting it with every page. Without it, each run printed 587 "Invalid isoformat
          # string" lines and left those pages stale (tallyfy/documentation#295).
          python scripts/update-last-modified.py --self-test
          python scripts/update-last-modified.py --dir=src/content/docs
        shell: bash
      - name: Commit and push lastUpdated dates
        if: ${{ github.event.workflow_run.head_branch != 'main' }}
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            git config --local user.email "action@github.com"
            git config --local user.name "GitHub Action"
            git add .
            git commit -m "Update lastUpdated dates from Git history" -a
            # --no-rebase, as the other generator jobs already do: a bare `git pull` after a
            # commit is what failed run 35813745697 when another push had landed (#296).
            git pull --no-rebase
            git push
          else
            echo "No lastUpdated changes needed"
          fi

  generate-related-articles:
    needs: [upload-to-tallyfy-answers, update-last-modified]
    #    if: needs.upload-to-tallyfy-search.outputs.upload-to-tallyfy-search-completed == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          ref: ${{ github.event.workflow_run.head_branch }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Generate related articles script
        run: |
          if [ "${{ github.event.workflow_run.head_branch }}" = "main" ]; then
            echo "Skipping Related articles regen on main — staging owns auto-regen (see #56). Cards arrive via merge."
            exit 0
          fi
          git pull
          python -m pip install --upgrade python-frontmatter requests
          python scripts/generate-related-articles.py --dir="$PWD/src/content/docs" --answers_api_key=${{ secrets.ANSWERS_API_KEY }} --base_url https://staging.answers.tallyfy.com
        shell: bash
      - name: Commit and push
        if: ${{ github.event.workflow_run.head_branch != 'main' }}
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            git config --local user.email "action@github.com"
            git config --local user.name "GitHub Action"
            git add .
            git commit -m "Push related articles" -a
            git pull --no-rebase
            git push
          else
            echo "No changes to commit"
          fi

  sync:
    # promotion-hold-gate is load-bearing here: this job is what actually publishes, by
    # rsyncing into support-docs `production`. `if: !failure()` only considers jobs in
    # `needs`, so a gate left out of this list would go red while the content shipped anyway.
    # ai-tell-gate is load-bearing here for the same reason promotion-hold-gate is: this job is
    # what publishes, and `if: !failure()` only considers jobs in `needs`, so a gate left out of
    # this list would go red while the content shipped anyway. Asserted by --check-wiring.
    # push-gate is named here directly, not only through repo-screenshots, because the `if:` below
    # is a status-function conditional and this repo has not measured whether failure() reaches a
    # failed job several edges up the needs graph (#464). Asserted by pipeline-guard.py.
    needs: [ push-gate, promotion-hold-gate, ai-tell-gate, validate-markdown, repo-screenshots, upload-to-tallyfy-answers, check-deleted-files, update-last-modified, generate-related-articles ]
    # The `conclusion == 'success'` term is load-bearing and is asserted by --check-wiring.
    # `!failure() && !cancelled()` alone is a status-function conditional, which replaces the
    # default "skip when a needed job was skipped". Neither term is true when the needs were
    # merely SKIPPED, so this job used to publish on runs where every validation job skipped.
    # Measured on run 27840821129: all six other jobs `skipped`, sync `success`. See #122.
    if: ${{ !failure() && !cancelled() && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      # The branch TIP, not head_sha: the generator jobs above push their own commits to the
      # branch, and those must ship. The publish guard below proves the tip holds nothing
      # else. Full history, because the guard must see whether head_sha is an ancestor of
      # the tip and read every commit between them, and a shallow checkout cannot say.
      - name: Checkout source repository (tallyfy/documentation)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0

      - name: Checkout target repository (tallyfy/support-docs)
        uses: actions/checkout@v7
        with:
          repository: tallyfy/support-docs
          token: ${{ secrets.GH_TOKEN }}
          path: target-repo
          ref: ${{ github.event.workflow_run.head_branch == 'main' && 'production' || 'staging' }}

      # This job had no Python step because it never needed one until the hold list started
      # being emitted here. Every other job in this file that runs `python` sets it up first,
      # and relying on a bare `python` existing on the runner image is the kind of assumption
      # that fails on an image update, in the one job that publishes.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      # The guard comes from the authoring branch, as the hold list does in "Sync files"
      # below. A workflow_run workflow runs the DEFAULT branch's copy of this file, so on a run
      # for main these steps exist before main carries the script, and run from main's
      # checkout they would fail every main publish until the next promotion brought it over.
      # It still judges THIS checkout, and reads the paths filter from this checkout's
      # generate-ids.yml, which is the copy GitHub applies to a push to this branch.
      - name: Fetch the publish guard from the authoring branch and prove it can refuse
        env:
          AUTHORING_BRANCH: staging
        run: |
          git fetch --no-tags origin "$AUTHORING_BRANCH"
          git show "FETCH_HEAD:scripts/pipeline-guard.py" > "$RUNNER_TEMP/pipeline-guard.py"
          test -s "$RUNNER_TEMP/pipeline-guard.py"
          python -m pip install --upgrade pyyaml
          python "$RUNNER_TEMP/pipeline-guard.py" --self-test
        shell: bash

      # Publish only what the gates read (tallyfy/work-queue#2748). The gates check out
      # workflow_run.head_sha; this job checks out the branch tip. If a person pushed again
      # while this run was in flight, the tip holds a commit no gate in this run read. The
      # guard allows only the generator jobs' own commits between the two, and otherwise this
      # run does not publish: the run for the newer push is queued behind it by the
      # concurrency group above, and publishes after its own gates.
      #
      # Exit 0 publish, 1 do not publish (a green job that says why), anything else means the
      # guard could not read the range: the job goes red and nothing is published. The two
      # steps below run only on an explicit `publish=true`, so no answer is never a publish.
      # Asserted by `scripts/ai-tell-check.py --check-wiring`.
      - name: Publish only what the gates read
        id: publish-guard
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          rc=0
          python "$RUNNER_TEMP/pipeline-guard.py" --head-sha "$HEAD_SHA" --repo . || rc=$?
          case "$rc" in
            0) echo "publish=true" >> "$GITHUB_OUTPUT" ;;
            1) echo "publish=false" >> "$GITHUB_OUTPUT"
               echo "sync did not publish. The publish guard's report above says why." ;;
            *) echo "::error::publish guard could not run (exit $rc), so nothing was published"
               exit 1 ;;
          esac
        shell: bash

      - name: Sync files
        if: ${{ steps.publish-guard.outputs.publish == 'true' }}
        run: |
          set -euo pipefail
          rsync -av --delete src/content/docs/ target-repo/src/content/docs/

          # documentation_assets.csv carries the alt text for every documentation image.
          # support-docs reads it at build time (src/plugins/remark/inject-alt-text.ts and
          # src/utils/structured-data.ts), but nothing ever synced it, so the copy over there
          # only stayed correct because both files happened to be identical. The first image
          # added after they diverged would have shipped with empty alt text and nothing would
          # have reported it. See tallyfy/documentation#116.
          test -f documentation_assets.csv || { echo "::error::documentation_assets.csv missing from source checkout"; exit 1; }
          cp documentation_assets.csv target-repo/documentation_assets.csv

          # Assert the copy landed and is non-trivial, so a truncated or empty file cannot be
          # committed silently. A header-only CSV is 1 line, so anything under 2 is broken.
          rows=$(wc -l < target-repo/documentation_assets.csv | tr -d '[:space:]')
          echo "documentation_assets.csv synced: $rows line(s)"
          [ "$rows" -ge 2 ] || { echo "::error::documentation_assets.csv looks empty ($rows lines)"; exit 1; }
          cmp -s documentation_assets.csv target-repo/documentation_assets.csv \
            || { echo "::error::documentation_assets.csv differs after copy"; exit 1; }

          # The hold list, for the OTHER road into production. promotion-hold-gate only sees
          # promotions in THIS repo; support-docs `staging` can be merged into its `production`
          # directly, and Cloudflare Pages builds that branch on push, so that road publishes
          # this repo's content with the gate never invoked (tallyfy/documentation#135).
          # support-docs enforces holds inside `npm run build`, which is the one step Pages
          # will not publish past, and this is what supplies the list it enforces.
          #
          # --emit-effective-holds, NOT a plain cp: a hold released for this promotion only via
          # `[release-hold: <id>]` stays on its line in the source file by design, so copying
          # it verbatim would hand support-docs a hold we have already, deliberately, allowed
          # past - and its production build would fail on content we meant to ship.
          #
          # HEAD, not workflow_run.head_sha. This job checked out the branch at the default
          # fetch-depth of 1 until the publish guard needed full history, and then head_sha was
          # often not an object it had, so `git log -1 <sha>` died on an unknown revision. HEAD
          # is the tree being published. On a promotion to main this pipeline's generator jobs
          # early-exit, so HEAD is normally the promotion's own commit, the one whose message
          # carries any release marker. generate-ids.yml is the one generator that can still
          # commit on main.
          # The SOURCE list comes from the authoring branch, exactly as promotion-hold-gate
          # fetches it there. This step had the same defect and a wider blast radius: on a main
          # promote it read main's copy, which carries no active holds, so it wrote an empty list
          # into support-docs and disarmed the build gate on the very road that gate exists to
          # guard. Measured 2026-09-20 after the promote of 0a6b25249: support-docs `production`
          # read 0 active holds while `staging` read 1. See tallyfy/documentation#270.
          git fetch --no-tags origin staging
          git show "FETCH_HEAD:.github/promotion-holds.txt" > "$RUNNER_TEMP/source-holds.txt"
          test -s "$RUNNER_TEMP/source-holds.txt"
          python scripts/promotion-hold-check.py \
            --commit HEAD \
            --holds "$RUNNER_TEMP/source-holds.txt" \
            --emit-effective-holds target-repo/promotion-holds.txt
          test -s target-repo/promotion-holds.txt \
            || { echo "::error::effective hold list is missing or empty after emit"; exit 1; }
          # Prove the emitted file parses as a hold list, so a malformed emission is caught
          # here and not in a Cloudflare build log where nobody is watching. --branch staging
          # makes this a parse-only assertion: check() parses before it looks at any branch.
          python scripts/promotion-hold-check.py \
            --holds target-repo/promotion-holds.txt --branch staging --commit HEAD \
            || { echo "::error::emitted hold list does not parse"; exit 1; }
          echo "effective hold list synced: $(wc -l < target-repo/promotion-holds.txt) line(s)"

      - name: Commit and push changes
        if: ${{ steps.publish-guard.outputs.publish == 'true' }}
        run: |
          # WHERE THE PROVENANCE LIVES, AND WHY IT IS NOT IN THE FILE (tallyfy/documentation#171).
          # This job writes promotion-holds.txt to support-docs `staging` on one road and to
          # `production` on the other, and those two roads are never the same commit. So a
          # per-promotion value in that FILE guaranteed the two branches differed and guaranteed
          # a merge conflict on a security gate file, every cycle. Three pull requests existed
          # only to clear it (support-docs #238, #239, #240), and routine conflicts in a gate
          # file train people to resolve by eye, which is the real cost. A commit message cannot
          # conflict, so the producing commit is recorded here instead.
          #
          # This also keeps the chain to a released hold intact in one hop: a
          # `[release-hold: <id>]` marker lives in the promotion's own commit message in `main`
          # forever, and the trailer below names that exact commit.
          #
          # Resolved BEFORE `cd target-repo`, so it is THIS repo's HEAD and not support-docs'.
          # Asserted non-empty because this step does not set -e, so an unresolved SHA would
          # otherwise be committed as an empty trailer.
          SRC_SHA=$(git rev-parse HEAD)
          [ -n "$SRC_SHA" ] || { echo "::error::could not resolve the source commit for the sync trailer"; exit 1; }
          cd target-repo
          git config user.name "GitHub Actions Bot"
          git config user.email "<>"
          git config pull.rebase false
          git add src/content/docs documentation_assets.csv promotion-holds.txt
          TARGET_BRANCH=${{ github.event.workflow_run.head_branch == 'main' && 'production' || 'staging' }}
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Sync docs from tallyfy/documentation" -m "Source commit: $SRC_SHA"
            git pull origin $TARGET_BRANCH --no-rebase || true
            git push origin $TARGET_BRANCH
          fi
