name: Tallyfy Answers - Generate IDs


on:
  push:
    branches:
      - main
      - staging
    paths:
      - src/content/docs/**
      # documentation_assets.csv supplies the alt text for every documentation image, and the
      # sync job in documentation-pipeline.yml copies it to support-docs. This workflow is the
      # head of that chain (the pipeline runs on its workflow_run), so a path missing here is a
      # change that never syncs. Captioning is the main thing that edits this file and it edits
      # nothing else, which made this the one path that mattered most.
      # Measured before the fix: a CSV-only commit produced 0 workflow runs, against 2 for a
      # commit touching a workflow. See tallyfy/documentation#116.
      - documentation_assets.csv
      # The hold list is synced to support-docs and enforced there at build time (#135).
      # Without this path, adding a hold would not reach support-docs until the next content
      # push, leaving a window in which the other road into production is still ungated.
      - .github/promotion-holds.txt
      - .github/workflows/documentation-pipeline.yml
      - .github/workflows/publish.yml
      - .github/workflows/generate-ids.yml
      - scripts/**
      - '!src/content/docs/pro/changelog/**'
  workflow_dispatch:

# One run per branch at a time, like documentation-pipeline.yml (tallyfy/documentation#296).
# This workflow commits and pushes IDs to the branch, and its completion starts the pipeline,
# so serializing it here also starts the pipeline runs in push order. cancel-in-progress is
# false so a push of IDs is never cut off. GitHub keeps only one WAITING run per group, so a
# third push while one run works and one waits drops the waiting one. Since owner decision 218
# (2026-10-03, #296) that loses nothing: generate-ids.py reads the whole tree on every run, so
# the run that takes the dropped one's place gives its pages an id. Asserted by
# `scripts/pipeline-guard.py --check-wiring`, which pr-validate.yml runs.
concurrency:
  group: generate-ids-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-ids:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      # The whole tree, not the pages this push added (owner decision 218, #296). A page that
      # lacks an id, or still carries the all-zero placeholder, gets one; an existing id is
      # never changed; at most 50 pages per run. The self-test runs first so the script proves
      # it can go red before it writes anything.
      - name: Give every page that lacks an id one
        run: |
          python -m pip install --upgrade python-frontmatter
          python scripts/generate-ids.py --self-test
          python scripts/generate-ids.py --dir=$PWD
        shell: bash
      - name: Commit and push new articles with IDs
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            git config --local user.email "action@github.com"
            git config --local user.name "GitHub Action"
            git pull --no-rebase
            git add .
            if git diff --cached --quiet; then
              echo "No ID changes to commit after git pull. Skipping commit so the pipeline can proceed."
            else
              git commit -m "Push Articles With ID(s)"
              git push
            fi
          else
            echo "No page lacks an id. Nothing to commit."
          fi
    outputs:
      generate-ids-completed: ${{ steps.generate-ids.outcome }}