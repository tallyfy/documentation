name: Tallyfy Answers - Generate IDs


on:
  push:
    branches:
      - main
      - staging
    paths:
      - src/content/docs/**
      # documentation_assets.csv supplies the alt text for every documentation image, and the
      # sync job in documentation-pipeline.yml copies it to support-docs. This workflow is the
      # head of that chain (the pipeline runs on its workflow_run), so a path missing here is a
      # change that never syncs. Captioning is the main thing that edits this file and it edits
      # nothing else, which made this the one path that mattered most.
      # Measured before the fix: a CSV-only commit produced 0 workflow runs, against 2 for a
      # commit touching a workflow. See tallyfy/documentation#116.
      - documentation_assets.csv
      # The hold list is synced to support-docs and enforced there at build time (#135).
      # Without this path, adding a hold would not reach support-docs until the next content
      # push, leaving a window in which the other road into production is still ungated.
      - .github/promotion-holds.txt
      - .github/workflows/documentation-pipeline.yml
      - .github/workflows/generate-ids.yml
      - scripts/**
      # Screenshots committed for the pipeline to upload (tallyfy/documentation#464). A pull
      # request that only adds an image here must still start a run, or the image is never
      # uploaded. Asserted by `scripts/pipeline-guard.py --check-wiring`.
      # Dated 2026-11-06 (#464): .github/workflows/publish.yml was listed above until then; no
      # such file exists.
      - screenshots/**
      # Changelog pages are not excluded here. Until #475 (2026-11-06) this list ended with
      # '!src/content/docs/pro/changelog/**', so a changelog-only push started no run and never
      # published: #474 reached main and the page stayed 404 until a manual dispatch.
      # generate-ids.py (SKIP_PREFIX) and answers-connector.py (skip_dirs) already leave
      # changelog pages out of ids and search, so starting a run for one changes only that.
  workflow_dispatch:

# One run per branch at a time, like documentation-pipeline.yml (tallyfy/documentation#296).
# This workflow commits and pushes IDs to the branch, and its completion starts the pipeline,
# so serializing it here also starts the pipeline runs in push order. cancel-in-progress is
# false so a push of IDs is never cut off. GitHub keeps only one WAITING run per group, so a
# third push while one run works and one waits drops the waiting one. Since owner decision 218
# (2026-10-03, #296) that loses nothing: generate-ids.py reads the whole tree on every run, so
# the run that takes the dropped one's place gives its pages an id. Asserted by
# `scripts/pipeline-guard.py --check-wiring`, which pr-validate.yml runs.
concurrency:
  group: generate-ids-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The push gate (tallyfy/documentation#464). A GitHub App with contents: write, such as
  # launchbrightly[bot], can push to staging or main without a pull request, and a ruleset cannot
  # exempt the pipeline's own pushes. So every job that holds a secret, an environment or a write
  # token waits for this one, and it stops them when a bot other than github-actions[bot] and
  # tallyfy-workhorse[bot] put commits on the branch outside a merged pull request. It then opens
  # one issue listing them; a person accepts them by closing that issue as completed.
  # The one exception (tallyfy/documentation#548): launchbrightly[bot]'s merge of its own pull
  # request #N into staging, when the newest pr-validate.yml run on its head that has the job
  # "LaunchBrightly PR guard (#N into staging)" shows it has passed, read with `actions: read`. The
  # gate never waits for an unfinished guard; such a merge stops until the guard has passed and the
  # run is started again, or a person accepts it.
  #
  # No `needs`, no `if:` and no checkout: it always runs, and it runs no code from the repository,
  # only the script below, which an app without the workflows permission cannot change. The same
  # script is in documentation-pipeline.yml; only the env differs. `scripts/pipeline-guard.py --check-wiring`
  # asserts all of this, and that every job holding a secret, an environment or a push waits for it.
  push-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: read
      issues: write
    steps:
      - name: Stop when commits reached the branch without a pull request
        uses: actions/github-script@v9
        env:
          GATE_MODE: push
          GATE_BRANCH: ${{ github.ref_name }}
          GATE_RUN_ID: ${{ github.run_id }}
          GATE_HEAD: ${{ github.sha }}
        with:
          script: |
            // The push gate (tallyfy/documentation#464). A GitHub App with contents: write can push to staging
            // or main without a pull request, and a ruleset cannot exempt the pipeline's own pushes, so this
            // job stops every job after it instead. launchbrightly[bot] (id 270903805) is the app it was
            // written for, but the rule covers every app bot except the two allowed below.
            //
            // It runs no code from the repository: the logic is here, in a workflow file, which an app
            // without the workflows permission cannot change, and it reads only the GitHub API. The copy in
            // generate-ids.yml and the copy in documentation-pipeline.yml must stay identical; only their env
            // differs. `scripts/pipeline-guard.py --check-wiring` asserts both.
            //
            // Range: from the head of the last run of generate-ids.yml on this branch that concluded success
            // (or of the run that started this one, when it succeeded) through this run's head. In the
            // documentation pipeline the head is the branch tip, because every later job checks out the tip.
            // At most 250 commits. Runs of documentation-pipeline.yml cannot be the anchor: on workflow_run
            // the API reports every one of them as staging, at staging's head (measured 2026-11-06).
            //
            // A commit stops the run when a bot other than the two allowed authored or committed it and no
            // merged pull request has it as its merge commit. A push or merge to the branch since the anchor
            // stops it when a bot other than the two allowed made it, whatever the commit says about its
            // author, because the repository activity API records who pushed. A person accepts stopped commits
            // by closing this job's issue as completed. Anything it cannot read fails the job.
            //
            // One exception (tallyfy/documentation#548): LaunchBrightly's merge of its own pull request into
            // staging. On staging, the merge commit of a pull request #N that launchbrightly[bot] opened passes only
            // when, of the pr-validate.yml runs on that pull request's head, the newest one that has a job named
            // "LaunchBrightly PR guard (#N into staging)" shows that job has already passed. Runs without that job,
            // such as another pull request's run on the same commit or one waiting for approval, do not count. That
            // holds whoever merged it and however: on staging every commit in the range, and every merge in the
            // activity log, is looked up by the pull request it merged, whatever the commits name as their author,
            // and a person's merge whose pull request cannot be found stops the run. A merge by the app itself
            // passes on the same terms. A read that fails on GitHub's side is tried once more at once. The
            // guard is read from the Actions API, as a job pr-validate.yml defines, because any token with checks:
            // write can create a check run. The gate never waits: their app is to merge after the guard has passed,
            // and a merge before that stops the run until the guard has passed and the run is started again, or a
            // person accepts it.
            // Any push by the app, any push or merge by it on main, and any other app still stop the run; on main a
            // person's merge is judged as before. The push or merge that produced the anchor is judged again on
            // every run, so an entry the activity log listed only after an earlier run still gets judged.
            const ALLOWED_BOTS = ['github-actions[bot]', 'tallyfy-workhorse[bot]'];
            // Read 2026-11-17 from GET /users/launchbrightly[bot] (type Bot); the org's installed app has slug launchbrightly.
            const LB_BOT = 'launchbrightly[bot]';
            const LB_BOT_ID = 270903805;
            const LB_BRANCH = 'staging';
            // The workflow and job that hold their pull requests to screenshots and image lines. The job's name
            // carries the pull request number and the base it judged, so a pass for another pull request or base
            // never counts here.
            const LB_GUARD_WORKFLOW = 'pr-validate.yml';
            const LB_GUARD_JOB = (number) => `LaunchBrightly PR guard (#${number} into ${LB_BRANCH})`;
            const MAX_COMMITS = 250;
            const MAX_ACTIVITY_PAGES = 5;
            const SHA_RE = /^[0-9a-f]{40}$/;
            const gateEnv = process.env;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = gateEnv.GATE_BRANCH || '';
            const dryRun = gateEnv.GATE_DRY_RUN === '1';
            const title = `Docs pipeline stopped: the push gate did not let commits on ${branch} through`;
            // The title before #548. Issues under it are still matched, so an acceptance made on one still counts.
            const oldTitle = `Docs pipeline stopped: commits reached ${branch} without a pull request`;
            const isGateIssue = (issue) => !issue.pull_request && (issue.title === title || issue.title === oldTitle);
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            class CannotDecide extends Error {}
            const short = (sha) => String(sha || '').slice(0, 12);
            const isBotLogin = (login) => /\[bot\]$/i.test(String(login || ''));
            const disallowed = (login) => Boolean(login) && !ALLOWED_BOTS.includes(String(login).toLowerCase());

            // The app bot a commit names: its GitHub account when that is a bot, else a [bot] name in its git
            // identity, so a bot's commit with an email GitHub does not link to an account is still seen.
            function botIn(user, name, email) {
              if (user && (user.type === 'Bot' || isBotLogin(user.login))) return String(user.login).toLowerCase();
              const m = `${name || ''} ${email || ''}`.match(/([A-Za-z0-9][A-Za-z0-9-]*\[bot\])/i);
              return m ? m[1].toLowerCase() : null;
            }

            async function api(route, params) {
              // A full URL (the activity API's next page) already carries its query; add nothing to it.
              const call = () => (route.includes('https://') ? github.request(route)
                : github.request(route, { owner, repo, ...(params || {}) }));
              try {
                try {
                  return await call();
                } catch (err) {
                  // A read that failed on GitHub's side is tried once more, at once; a write or any other failure is not.
                  if (!route.startsWith('GET ') || !(Number(err.status) >= 500)) throw err;
                  return await call();
                }
              } catch (err) {
                throw new CannotDecide(`${route} failed: ${err.status || ''} ${err.message || err}`.trim());
              }
            }

            async function findAnchor() {
              if (dryRun && SHA_RE.test(gateEnv.GATE_ANCHOR_OVERRIDE || '')) {
                return { sha: gateEnv.GATE_ANCHOR_OVERRIDE, from: 'GATE_ANCHOR_OVERRIDE (dry run only)' };
              }
              if (gateEnv.GATE_TRIGGER_CONCLUSION === 'success' && SHA_RE.test(gateEnv.GATE_TRIGGER_HEAD || '')) {
                return { sha: gateEnv.GATE_TRIGGER_HEAD, from: `the generate-ids run that started this one (${gateEnv.GATE_TRIGGER_RUN_ID})` };
              }
              const skip = new Set([String(gateEnv.GATE_RUN_ID || ''), String(gateEnv.GATE_TRIGGER_RUN_ID || '')]);
              const { data } = await api('GET /repos/{owner}/{repo}/actions/workflows/{workflow_id}/runs',
                { workflow_id: 'generate-ids.yml', branch, status: 'success', per_page: 20 });
              const runs = ((data && data.workflow_runs) || []).filter((r) => r.head_branch === branch
                && r.conclusion === 'success' && !skip.has(String(r.id)) && SHA_RE.test(r.head_sha || ''));
              if (!runs.length) {
                throw new CannotDecide(`no earlier successful run of generate-ids.yml on ${branch}, so there is no checked point to start from`);
              }
              return { sha: runs[0].head_sha, from: `generate-ids run ${runs[0].id}` };
            }

            async function findHead() {
              if (gateEnv.GATE_MODE === 'push') {
                if (!SHA_RE.test(gateEnv.GATE_HEAD || '')) throw new CannotDecide(`GATE_HEAD ${JSON.stringify(gateEnv.GATE_HEAD)} is not a commit`);
                return gateEnv.GATE_HEAD;
              }
              const { data } = await api('GET /repos/{owner}/{repo}/branches/{branch}', { branch });
              const sha = data && data.commit && data.commit.sha;
              if (!SHA_RE.test(sha || '')) throw new CannotDecide(`could not read the tip of ${branch}`);
              return sha;
            }

            async function rangeCommits(base, head) {
              if (base === head) return { status: 'identical', commits: [] };
              const seen = new Map();
              let status = '';
              let total = -1;
              for (let page = 1; page <= Math.ceil(MAX_COMMITS / 100); page += 1) {
                const { data } = await api('GET /repos/{owner}/{repo}/compare/{basehead}',
                  { basehead: `${base}...${head}`, per_page: 100, page });
                status = data && data.status;
                total = data ? data.total_commits : -1;
                if (status === 'identical' || status === 'behind') return { status, commits: [] };
                if (status !== 'ahead') {
                  throw new CannotDecide(`${short(base)}...${short(head)} is ${JSON.stringify(status)}, so the branch history was rewritten since the last checked run`);
                }
                if (!(total >= 0)) throw new CannotDecide('the compare response has no total_commits');
                if (total > MAX_COMMITS) throw new CannotDecide(`${total} commits since the last checked run, over the cap of ${MAX_COMMITS}`);
                const batch = (data && data.commits) || [];
                for (const c of batch) seen.set(c.sha, c);
                if (seen.size >= total || !batch.length) break;
              }
              if (seen.size !== total) throw new CannotDecide(`read ${seen.size} of ${total} commits in ${short(base)}...${short(head)}`);
              return { status, commits: [...seen.values()] };
            }

            function identity(c) {
              const a = (c.commit && c.commit.author) || {};
              const k = (c.commit && c.commit.committer) || {};
              const acct = (u) => (u && u.login ? ` (${u.login})` : '');
              return `author ${a.name || '?'} <${a.email || '?'}>${acct(c.author)}, committer ${k.name || '?'} <${k.email || '?'}>${acct(c.committer)}`;
            }

            async function pushesSince(anchorSha) {
              // Newest first. Every push or merge down to and including the one that produced the anchor.
              const out = [];
              let next = null;
              for (let page = 1; page <= MAX_ACTIVITY_PAGES; page += 1) {
                const res = next ? await api(`GET ${next}`)
                  : await api('GET /repos/{owner}/{repo}/activity', { ref: `refs/heads/${branch}`, per_page: 100 });
                for (const a of (res.data || [])) {
                  out.push(a);
                  if (a.after === anchorSha) return out;
                }
                const link = String((res.headers && res.headers.link) || '');
                const m = link.match(/<([^>]+)>;\s*rel="next"/);
                if (!m) return out;  // the whole history the API keeps, all of it after the anchor
                next = m[1];
              }
              throw new CannotDecide(`more than ${MAX_ACTIVITY_PAGES * 100} pushes since ${short(anchorSha)}, more than this gate reads`);
            }

            async function acceptedShas() {
              // A person closing this job's issue as completed accepts every commit the issue lists.
              const out = new Map();
              const { data } = await api('GET /repos/{owner}/{repo}/issues',
                { state: 'closed', creator: 'github-actions[bot]', per_page: 100 });
              for (const issue of (data || [])) {
                if (!isGateIssue(issue)) continue;
                const { data: full } = await api('GET /repos/{owner}/{repo}/issues/{issue_number}', { issue_number: issue.number });
                const by = full && full.closed_by;
                if (!full || full.state_reason !== 'completed' || !by || by.type === 'Bot' || isBotLogin(by.login)) continue;
                for (const m of String(full.body || '').matchAll(/\b[0-9a-f]{40}\b/g)) {
                  if (!out.has(m[0])) out.set(m[0], issue.number);
                }
              }
              return out;
            }

            async function report(lines, anchor, head, range) {
              const body = [
                `The push gate stopped the documentation pipeline on \`${branch}\`. These commits reached the branch in a way it does not let through. Each line says who made it and why it stopped:`,
                '',
                ...lines,
                '',
                `Range checked: \`${short(anchor.sha)}...${short(head)}\`, ${range.commits.length} commit(s). Run: ${runUrl}`,
                '',
                'Every job that holds a secret, an environment or a write token waits for this gate, so nothing after it ran.',
                '',
                'To accept these commits, review each one, then close this issue as completed and re-run the failed workflow. Closing it as not planned keeps the pipeline stopped. A close by a bot is ignored.',
              ].join('\n');
              if (dryRun) {
                core.info(`DRY RUN: would open or update the issue "${title}" with:\n${body}`);
                return;
              }
              const { data: open } = await api('GET /repos/{owner}/{repo}/issues',
                { state: 'open', creator: 'github-actions[bot]', per_page: 100 });
              const existing = (open || []).filter(isGateIssue);
              if (existing.length) {
                const issue = existing[0];
                const missing = lines.filter((l) => !String(issue.body || '').includes(l.slice(3, 43)));
                if (missing.length) {
                  await api('PATCH /repos/{owner}/{repo}/issues/{issue_number}',
                    { issue_number: issue.number, body: `${issue.body || ''}\n\nAlso stopped by ${runUrl}:\n\n${missing.join('\n')}` });
                }
                core.error(`See #${issue.number}.`);
              } else {
                const { data: created } = await api('POST /repos/{owner}/{repo}/issues', { title, body });
                core.error(`Opened #${created.number}.`);
              }
            }

            const isLaunchBrightly = (login, id) => String(login || '').toLowerCase() === LB_BOT && id === LB_BOT_ID;
            const lbProblems = new Map();
            const mergedPrs = new Map();
            let recentMerges = null;

            // The 100 pull requests into this branch most recently closed or updated, read once per run.
            function recentlyClosed() {
              if (!recentMerges) {
                recentMerges = (async () => {
                  const { data } = await api('GET /repos/{owner}/{repo}/pulls',
                    { state: 'closed', base: branch, sort: 'updated', direction: 'desc', per_page: 100 });
                  if (!Array.isArray(data)) throw new CannotDecide(`could not read the pull requests closed into ${branch}`);
                  return data;
                })();
              }
              return recentMerges;
            }

            // The merged pull request whose merge commit is sha, or null. Read once per commit. GitHub may link a
            // commit to its pull request a little after the merge, so when the commit's own list has none, the pull
            // requests most recently closed into the branch are read too: a pull request records its merge commit
            // when it is merged.
            function mergedPrOf(sha) {
              if (!mergedPrs.has(sha)) {
                mergedPrs.set(sha, (async () => {
                  const isMerge = (p) => p && p.merged_at && p.merge_commit_sha === sha;
                  const { data: prs } = await api('GET /repos/{owner}/{repo}/commits/{commit_sha}/pulls', { commit_sha: sha, per_page: 100 });
                  if (!Array.isArray(prs)) throw new CannotDecide(`could not read the pull requests of ${short(sha)}`);
                  return prs.find(isMerge) || (await recentlyClosed()).find(isMerge) || null;
                })());
              }
              return mergedPrs.get(sha);
            }

            // On staging, why sha may not pass as the merge commit of a pull request launchbrightly[bot] opened
            // ('' when it may), or null when sha is not the merge commit of such a pull request.
            async function theirMergeProblem(sha) {
              const pr = await mergedPrOf(sha);
              const author = (pr && pr.user) || {};
              if (!pr || !isLaunchBrightly(author.login, author.id)) return null;
              return lbMergeProblem(sha);
            }

            // Why sha is not LaunchBrightly's merge of its own pull request into staging with a passed guard at
            // the merged head, or '' when it is. A missing, unfinished or failed guard is a reason; anything it
            // cannot read throws CannotDecide, which fails the gate.
            function lbMergeProblem(sha) {
              if (!lbProblems.has(sha)) lbProblems.set(sha, readLbMergeProblem(sha));
              return lbProblems.get(sha);
            }

            // Of the pr-validate.yml pull_request runs on head, the newest one that has a job named jobName, with
            // that job; null when no run has it. A run without that job is another pull request's run on the same
            // commit, or one that has not started its jobs (such as a run waiting for approval), so it is passed
            // over: anyone can open a pull request from a commit, and their run must not stand in for this one.
            // Every list is read whole, or the gate cannot decide.
            async function readGuardJob(head, jobName) {
              const { data } = await api('GET /repos/{owner}/{repo}/actions/workflows/{workflow_id}/runs',
                { workflow_id: LB_GUARD_WORKFLOW, head_sha: head, event: 'pull_request', per_page: 100 });
              const runs = data && data.workflow_runs;
              if (!Array.isArray(runs) || !(data.total_count >= 0)) throw new CannotDecide(`could not read the ${LB_GUARD_WORKFLOW} runs on ${short(head)}`);
              if (runs.length !== data.total_count) throw new CannotDecide(`read ${runs.length} of ${data.total_count} ${LB_GUARD_WORKFLOW} runs on ${short(head)}`);
              const newestFirst = runs.filter((r) => r && r.event === 'pull_request' && r.head_sha === head)
                .sort((a, b) => Number(b.id) - Number(a.id));
              for (const run of newestFirst) {
                const { data: listed } = await api('GET /repos/{owner}/{repo}/actions/runs/{run_id}/jobs', { run_id: run.id, per_page: 100 });
                const jobs = listed && listed.jobs;
                if (!Array.isArray(jobs) || !(listed.total_count >= 0)) throw new CannotDecide(`could not read the jobs of run ${run.id}`);
                if (jobs.length !== listed.total_count) throw new CannotDecide(`read ${jobs.length} of ${listed.total_count} jobs of run ${run.id}`);
                const named = jobs.filter((j) => j && j.name === jobName);
                if (named.length > 1) throw new CannotDecide(`run ${run.id} has ${named.length} jobs named "${jobName}"`);
                if (named.length) return { run, job: named[0] };
              }
              return null;
            }

            async function readLbMergeProblem(sha) {
              if (branch !== LB_BRANCH) return `${LB_BOT} may merge only into ${LB_BRANCH}, and this is ${branch}`;
              const pr = await mergedPrOf(sha);
              if (!pr) return `no merged pull request has ${short(sha)} as its merge commit`;
              const author = pr.user || {};
              if (!isLaunchBrightly(author.login, author.id)) {
                return `pull request #${pr.number} was opened by ${author.login || 'an author this gate could not read'} (id ${author.id}), not ${LB_BOT} (id ${LB_BOT_ID})`;
              }
              const base = pr.base && pr.base.ref;
              if (base !== LB_BRANCH) return `pull request #${pr.number} was merged into ${base || 'a branch this gate could not read'}, not ${LB_BRANCH}`;
              const head = pr.head && pr.head.sha;
              if (!SHA_RE.test(head || '')) throw new CannotDecide(`could not read the head of pull request #${pr.number}`);
              const jobName = LB_GUARD_JOB(pr.number);
              const guard = await readGuardJob(head, jobName);
              if (!guard) return `no ${LB_GUARD_WORKFLOW} run on ${short(head)} has a job "${jobName}", so the guard never ran for it`;
              const job = guard.job;
              if (job.status !== 'completed') {
                return `"${jobName}" in ${LB_GUARD_WORKFLOW} run ${guard.run.id} had not finished at ${short(head)} (merge only after it passes)`;
              }
              if (job.conclusion !== 'success') {
                return `"${jobName}" in ${LB_GUARD_WORKFLOW} run ${guard.run.id} ended ${job.conclusion || 'without a result'} at ${short(head)}`;
              }
              core.info(`${short(sha)} is the merge of ${LB_BOT}'s pull request #${pr.number} into ${LB_BRANCH}, and "${jobName}" passed in run ${guard.run.id} at ${short(head)}.`);
              return '';
            }

            async function gate() {
              if (!['push', 'pipeline'].includes(gateEnv.GATE_MODE)) throw new CannotDecide(`GATE_MODE is ${JSON.stringify(gateEnv.GATE_MODE)}`);
              if (!/^[A-Za-z0-9._/-]+$/.test(branch)) throw new CannotDecide(`branch ${JSON.stringify(branch)} is not a branch name`);
              const anchor = await findAnchor();
              const head = await findHead();
              const range = await rangeCommits(anchor.sha, head);
              const found = new Map();
              const add = (sha, why) => { if (!found.has(sha)) found.set(sha, []); found.get(sha).push(why); };

              for (const c of range.commits) {
                if (branch === LB_BRANCH) {
                  // On staging every commit is looked up: the merge commit of a pull request LaunchBrightly opened
                  // passes only with its guard passed, whoever merged it and whatever the commit names as its author.
                  const problem = await theirMergeProblem(c.sha);
                  if (problem !== null) {
                    if (problem) add(c.sha, `${identity(c)}; ${problem}`);
                    continue;
                  }
                }
                const bots = [...new Set([
                  botIn(c.author, c.commit && c.commit.author && c.commit.author.name, c.commit && c.commit.author && c.commit.author.email),
                  botIn(c.committer, c.commit && c.commit.committer && c.commit.committer.name, c.commit && c.commit.committer && c.commit.committer.email),
                ].filter(disallowed))];
                if (!bots.length) continue;
                const merged = await mergedPrOf(c.sha);
                if (merged) {
                  core.info(`${short(c.sha)} by ${bots.join(' and ')} is the merge commit of pull request #${merged.number}.`);
                  continue;
                }
                add(c.sha, `${identity(c)}; no merged pull request has it as its merge commit`);
              }

              const pushes = await pushesSince(anchor.sha);
              for (const a of pushes) {
                const who = a.actor && a.actor.login;
                if (!SHA_RE.test(a.after || '')) {
                  // It names no commit, so it put none on the branch to judge or accept; every commit in the range is judged above.
                  core.warning(`A ${a.activity_type || 'change'} to ${branch} at ${a.timestamp} names no commit, so it is not judged.`);
                  continue;
                }
                if (!who) {
                  // Who made it cannot be read, so it is not let through; a person can accept it on the issue.
                  add(a.after, `${a.activity_type} to ${branch} at ${a.timestamp} by someone this gate could not read`);
                  continue;
                }
                if (!(a.actor.type === 'Bot' || isBotLogin(who)) || !disallowed(who)) {
                  // A person's merge into staging, or an allowed app's: when the pull request is LaunchBrightly's, its
                  // guard must have passed, whatever the merged commits say about who wrote them. A merge whose pull
                  // request cannot be found is not let through, since then nobody can tell whose it was.
                  if (branch === LB_BRANCH && a.activity_type === 'pr_merge') {
                    if (!(await mergedPrOf(a.after))) {
                      add(a.after, `${a.activity_type} to ${branch} by ${who} at ${a.timestamp}; no merged pull request has ${short(a.after)} as its merge commit, so this gate cannot tell whose pull request it was`);
                    } else {
                      const problem = await theirMergeProblem(a.after);
                      if (problem) add(a.after, `${a.activity_type} to ${branch} by ${who} at ${a.timestamp}; ${problem}`);
                    }
                  }
                  continue;
                }
                if (a.activity_type === 'pr_merge' && isLaunchBrightly(who, a.actor.id)) {
                  // A merge by LaunchBrightly's app itself: through only on the terms in lbMergeProblem.
                  const problem = await lbMergeProblem(a.after);
                  if (!problem) continue;
                  add(a.after, `${a.activity_type} to ${branch} by ${who} at ${a.timestamp}; ${problem}`);
                  continue;
                }
                add(a.after, `${a.activity_type} to ${branch} by ${who} at ${a.timestamp}`);
              }

              const accepted = found.size ? await acceptedShas() : new Map();
              const open = [...found].filter(([sha]) => !accepted.has(sha));
              for (const [sha] of found) {
                if (accepted.has(sha)) core.info(`${short(sha)} was accepted by a person in #${accepted.get(sha)}.`);
              }
              core.info(`Checked ${short(anchor.sha)}...${short(head)} on ${branch} (${range.status}): ${range.commits.length} commit(s) and ${pushes.length} push(es), starting from ${anchor.from}.`);
              if (!open.length) {
                core.info('No commit reached the branch in a way this gate stops.');
                return;
              }
              const lines = open.map(([sha, why]) => `- \`${sha}\`: ${why.join('; ')}`);
              for (const line of lines) core.error(line);
              await report(lines, anchor, head, range);
              core.setFailed(`${open.length} commit(s) reached ${branch} in a way this gate does not let through (the issue says why for each). Every job after this gate is stopped.`);
            }

            try {
              await gate();
            } catch (err) {
              if (err instanceof CannotDecide) core.setFailed(`The push gate could not decide, so nothing after it runs: ${err.message}`);
              else core.setFailed(`The push gate crashed, so nothing after it runs: ${(err && err.stack) || err}`);
            }

  generate-ids:
    # It pushes, and it runs scripts/generate-ids.py from the pushed tree with a token that can
    # write, so it waits for the push gate above (#464).
    needs: push-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      # The whole tree, not the pages this push added (owner decision 218, #296). A page that
      # lacks an id, or still carries the all-zero placeholder, gets one; an existing id is
      # never changed; at most 50 pages per run. The self-test runs first so the script proves
      # it can go red before it writes anything.
      - name: Give every page that lacks an id one
        run: |
          python -m pip install --upgrade python-frontmatter
          python scripts/generate-ids.py --self-test
          python scripts/generate-ids.py --dir="$PWD"
        shell: bash
      - name: Commit and push new articles with IDs
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            git config --local user.email "action@github.com"
            git config --local user.name "GitHub Action"
            git pull --no-rebase
            git add .
            if git diff --cached --quiet; then
              echo "No ID changes to commit after git pull. Skipping commit so the pipeline can proceed."
            else
              git commit -m "Push Articles With ID(s)"
              git push
            fi
          else
            echo "No page lacks an id. Nothing to commit."
          fi
