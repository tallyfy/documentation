name: PR validation

# Why this is a SEPARATE file rather than a `pull_request` trigger added to
# documentation-pipeline.yml (tallyfy/documentation#181).
#
# That pipeline's jobs include `sync`, which rsyncs src/content/docs/ into
# tallyfy/support-docs and is what actually publishes. Adding `pull_request` to
# that file would run `sync` from a pull request, so an unmerged branch would
# publish. Its other jobs also read `github.event.workflow_run.*`, which is empty
# on a pull_request event, so they would not behave as written either.
#
# So this file deliberately contains ONLY read-only validation. It mirrors the
# `validate-markdown` job in that pipeline, which is the job `sync` already
# depends on, and it adds nothing new to maintain.
#
# This check is ADVISORY. `staging` has no branch protection, so nothing here can
# block a merge; it exists so a pull request author sees a result BEFORE merging
# rather than finding out from a red pipeline on the default branch afterwards.
# Making it required is a separate decision and needs branch protection first.

on:
  pull_request:

# Least privilege, and it is load bearing rather than decorative: with only
# `contents: read` this workflow structurally cannot write to the repository,
# open a pull request, or push, whatever a future edit to it says.
permissions:
  contents: read

concurrency:
  # github.event_name is in the KEY on purpose. A group shared between a
  # pull_request run and a push run lets one cancel the other, and a cancelled
  # run reports as `cancelled` having started zero jobs, which reads as
  # deliberate. This workflow only fires on pull_request today, and the key keeps
  # that true if a trigger is ever added.
  group: pr-validate-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      # Byte for byte the same two commands the pipeline's validate-markdown job
      # runs, so a pull request cannot pass here and fail there.
      - name: Markdown lint
        run: |
          python -m pip install --upgrade pyyaml
          python scripts/markdown-lint.py --dir="$PWD"
        shell: bash

      - name: Accessibility lint (headings 1.3.1, alt text 1.1.1, D2 animation 2.2.2)
        run: python scripts/a11y-lint.py --dir="$PWD"
        shell: bash

      # The pipeline's own scripts, proved here before a merge rather than on the default
      # branch after it. Read-only: each self-test works in a temporary directory, and
      # --check-wiring only parses the workflow files. pyyaml comes from the lint step above.
      # update-last-modified imports frontmatter at module level, so its self-test needs it.
      # The three whole-tree reconcile scripts (owner decision 218, #296) need requests too, and
      # their self-tests talk only to a fake API they start on 127.0.0.1.
      # python-dotenv is for the asset inventory step below: scripts/asset_management/config.py
      # imports it when the module loads.
      - name: "Pipeline script self-tests (#296, #295)"
        run: |
          python -m pip install --upgrade python-frontmatter requests python-dotenv
          python scripts/pipeline-guard.py --self-test
          python scripts/pipeline-guard.py --check-wiring
          python scripts/update-last-modified.py --self-test
          python scripts/generate-ids.py --self-test
          python scripts/generate-snippets.py --self-test
          python scripts/check-deleted-files.py --self-test
          python scripts/answers-connector.py --self-test
        shell: bash

      # The writer of documentation_assets.csv keeps every column and refuses a key it has no
      # column for; upload and replace record who made an image and re-queue a changed one for
      # captions; audit and sync handle /screenshots/ paths (#462). Each self-test works on
      # files in a temporary directory, and the orchestrator's uses a fake uploader, so none
      # needs a credential or touches the real CSV. requests and python-dotenv come from the
      # step above. The last line only reads the real CSV: it fails when a row has lost its
      # source or the header has lost a column, for example after a hand-resolved conflict.
      # The last two lines prove the rules for screenshots committed under screenshots/ and the
      # pipeline's ingest of them, on scratch repositories with a fake R2 (#464). Neither needs
      # boto3 or a credential.
      - name: "Asset inventory self-tests (#462, #464)"
        run: |
          python scripts/asset_management/asset_inventory.py --self-test
          python scripts/asset_management/orchestrator.py --self-test
          python scripts/asset_management/audit_sync.py --self-test
          python scripts/asset_management/asset_inventory.py migrate-columns --check
          python scripts/asset_management/repo_screenshot_rules.py --self-test
          python scripts/asset_management/repo_screenshots.py --self-test
        shell: bash

      # A prose ` -- ` renders as an em dash today, which the writing rules ban,
      # and shows as a raw `--` once support-docs stops converting it
      # (tallyfy/documentation#287, tallyfy/support-docs#272). The self-test runs
      # first so this step proves it can go red before it reports green.
      # Exit codes: 0 clean, 1 findings, 2 the counter could not run.
      - name: Prose double hyphens (no ` -- ` used as a dash)
        run: |
          python scripts/prose-double-hyphen-check.py --self-test
          python scripts/prose-double-hyphen-check.py --dir src/content/docs
        shell: bash

      # D2 is pinned to the SAME version the site build downloads
      # (tallyfy/support-docs scripts/install-d2.sh, D2_VERSION="v0.7.0").
      # A validator running a different D2 than the build can pass what the
      # build fails, which is the whole reason the previous validator was
      # useless: it also validated at --dark-theme=200 while the build used 8.
      # Since support-docs#259 the build passes no --dark-theme at all, and the
      # gate keeps passing 8 on purpose: the flags block in
      # scripts/validate-d2.sh says why.
      #
      # No `|| true` and no soft mode anywhere in these two steps. A gate that
      # cannot fail is what tallyfy/documentation#192 is about.
      - name: Install D2 (pinned to the site build's version)
        run: |
          set -euo pipefail
          D2_VERSION="v0.7.0"
          curl -fsSL "https://github.com/terrastruct/d2/releases/download/${D2_VERSION}/d2-${D2_VERSION}-linux-amd64.tar.gz" -o /tmp/d2.tar.gz
          tar -xzf /tmp/d2.tar.gz -C /tmp
          echo "/tmp/d2-${D2_VERSION}/bin" >> "$GITHUB_PATH"
        shell: bash

      # Every D2 fence must compile with the build's own flags, and every colour
      # it emits must be in the house palette. The palette half matters because
      # an off-palette diagram compiles perfectly and renders correctly in light
      # mode, then goes invisible or off-brand once support-docs recolours
      # diagrams for dark mode - with nothing going red.
      #
      # Exit codes: 0 clean, 1 findings, 2 the gate could not run (no d2, no
      # python3, or zero fences discovered). Exit 2 is a failure on purpose: a
      # sweep that finds nothing satisfies every assertion made about it.
      #
      # The self-test runs first, so this step proves the gate can go red
      # before it reports green: a diagram with link: must pass and an
      # off-palette colour must still fail (tallyfy/documentation#363).
      - name: D2 diagram validation (compiles + house palette)
        run: |
          d2 --version
          bash scripts/validate-d2.sh --self-test
          bash scripts/validate-d2.sh
        shell: bash

  # LaunchBrightly's GitHub App opens pull requests that commit screenshots under
  # screenshots/launchbrightly/ and point article images at them (tallyfy/documentation#464).
  # Its pull requests may only add or change those images and image lines in existing articles,
  # with real alt text, and never documentation_assets.csv, which the pipeline writes after the
  # merge. Every pull request is also checked for /screenshots/ links to files that are not in the
  # merged tree. scripts/lb-pr-guard.py says what it refuses and why.
  #
  # It reads GitHub's test merge, so depth 2 brings the base (HEAD^1) and the pull request
  # (HEAD^2). The author comes in through env, never written into the script line. No secrets and
  # no environment: `scripts/pipeline-guard.py --check-wiring` asserts that for this whole file.
  lb-pr-guard:
    name: LaunchBrightly PR guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Prove the guard can refuse (one red and one green case per rule)
        run: python scripts/lb-pr-guard.py --self-test
        shell: bash

      # The guard and its rules come from the base branch when it has them, so a pull request
      # cannot pass itself by editing the check that judges it. The pull request's own copy is
      # used only until the base carries the guard.
      - name: Check what this pull request changes
        env:
          PR_AUTHOR_LOGIN: ${{ github.event.pull_request.user.login }}
          PR_AUTHOR_ID: ${{ github.event.pull_request.user.id }}
        run: |
          guard="$RUNNER_TEMP/lb-guard"
          mkdir -p "$guard/scripts/asset_management"
          if git cat-file -e HEAD^1:scripts/lb-pr-guard.py \
             && git cat-file -e HEAD^1:scripts/asset_management/repo_screenshot_rules.py; then
            git show HEAD^1:scripts/lb-pr-guard.py > "$guard/scripts/lb-pr-guard.py"
            git show HEAD^1:scripts/asset_management/repo_screenshot_rules.py \
              > "$guard/scripts/asset_management/repo_screenshot_rules.py"
            echo "Running the guard from the base branch."
          else
            cp scripts/lb-pr-guard.py "$guard/scripts/lb-pr-guard.py"
            cp scripts/asset_management/repo_screenshot_rules.py "$guard/scripts/asset_management/"
            echo "::notice::the base branch has no guard yet, so this run uses the pull request's own copy"
          fi
          test -s "$guard/scripts/lb-pr-guard.py"
          test -s "$guard/scripts/asset_management/repo_screenshot_rules.py"
          python "$guard/scripts/lb-pr-guard.py" --repo "$PWD"
        shell: bash
